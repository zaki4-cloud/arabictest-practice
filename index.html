            if (!soundEnabled) return;

                    gain.connect(audioCtx.destination);

        // ניהול מצב האפליקציה (State)
        let state = {
            currentView: 'home',
            selectedDayIndex: 0,
            activeTab: 'flashcards',
            
            cardIndex: 0,
            isCardFlipped: false,
            
            matchingRightItems: [],
            matchingLeftItems: [],
            selectedRightId: null,
            selectedLeftId: null,
            matchedIds: [],
            wrongPair: false,
            matchingMistakes: 0,

            quizIndex: 0,
            selectedOptionIndex: null,
            isAnswerChecked: false,
            quizScore: 0,

            completedDays: JSON.parse(localStorage.getItem('arabicPrepProgress_v2') || '{}')
        };

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function closeFeedbackModal() {
            document.getElementById('feedback-modal').classList.add('hidden');
        }

        function goHome() {
            closeFeedbackModal();
            state.currentView = 'home';
            document.getElementById('home-btn').classList.add('hidden');
            render();
        }

        function startDay(dayIndex) {
            closeFeedbackModal();
            state.selectedDayIndex = dayIndex;
            state.currentView = 'day';
            document.getElementById('home-btn').classList.remove('hidden');
            switchTab('flashcards');
        }

        function switchTab(tabName) {
            closeFeedbackModal();
            state.activeTab = tabName;
            const dayData = DAYS_DATA[state.selectedDayIndex];

            if (tabName === 'flashcards') {
                state.cardIndex = 0;
                state.isCardFlipped = false;
            } else if (tabName === 'matching') {
                initMatchingGame(dayData.matchingPairs);
            } else if (tabName === 'quiz') {
                state.quizIndex = 0;
                state.selectedOptionIndex = null;
                state.isAnswerChecked = false;
                state.quizScore = 0;
            }
            render();
        }

        function initMatchingGame(pairs) {
            state.matchingRightItems = shuffleArray(pairs.map(p => ({ id: p.id, text: p.arabic })));
            state.matchingLeftItems = shuffleArray(pairs.map(p => ({ id: p.id, text: p.hebrew })));
            state.selectedRightId = null;
            state.selectedLeftId = null;
            state.matchedIds = [];
            state.wrongPair = false;
            state.matchingMistakes = 0;
        }

        function toggleCardFlip() {
            state.isCardFlipped = !state.isCardFlipped;
            render();
        }

        function nextCard() {
            const total = DAYS_DATA[state.selectedDayIndex].flashcards.length;
            if (state.cardIndex < total - 1) {
                state.cardIndex++;
                state.isCardFlipped = false;
                render();
            } else {
                playSuccessSound('match');
                switchTab('matching');
            }
        }

        function prevCard() {
            if (state.cardIndex > 0) {
                state.cardIndex--;
                state.isCardFlipped = false;
                render();
            }
        }

        function selectMatchingItem(side, id) {
            if (state.matchedIds.includes(id) || state.wrongPair) return;

            if (side === 'right') {
                state.selectedRightId = (state.selectedRightId === id) ? null : id;
            } else {
                state.selectedLeftId = (state.selectedLeftId === id) ? null : id;
            }

            if (state.selectedRightId && state.selectedLeftId) {
                if (state.selectedRightId === state.selectedLeftId) {
                    state.matchedIds.push(state.selectedRightId);
                    state.selectedRightId = null;
                    state.selectedLeftId = null;
                    const totalPairs = DAYS_DATA[state.selectedDayIndex].matchingPairs.length;
                    playSuccessSound(state.matchedIds.length === totalPairs ? 'complete' : 'match');
                } else {
                    state.wrongPair = true;
                    state.matchingMistakes++;
                    render();
                    setTimeout(() => {
                        state.selectedRightId = null;
                        state.selectedLeftId = null;
                        state.wrongPair = false;
                        render();
                    }, 550);
                    return;
                }
            }
            render();
        }

        function selectQuizOption(index) {
            if (state.isAnswerChecked) return;
            state.selectedOptionIndex = index;
            state.isAnswerChecked = true;

            const currentQ = DAYS_DATA[state.selectedDayIndex].quiz[state.quizIndex];
            const totalQ = DAYS_DATA[state.selectedDayIndex].quiz.length;
            const isCorrect = (index === currentQ.correctIndex);

            if (isCorrect) {
                state.quizScore++;
                playSuccessSound('match');
            }

            render();
            showQuizFeedbackPopup(isCorrect, currentQ.explanation, state.quizIndex === totalQ - 1);
        }

        function showQuizFeedbackPopup(isCorrect, explanation, isLastQuestion) {
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-modal-card');
            
            card.className = `bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border-2 text-center space-y-3 animate-pop ${
                isCorrect ? 'border-emerald-400' : 'border-amber-400'
            }`;

            card.innerHTML = `
                <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-2xl ${
                    isCorrect ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'
                }">
                    ${isCorrect ? '✓' : '💡'}
                </div>
                <h4 class="text-lg font-extrabold ${isCorrect ? 'text-emerald-800' : 'text-amber-800'}">
                    ${isCorrect ? 'מעולה! תשובה נכונה 👏' : 'בואו נבדוק יחד'}
                </h4>
                <p class="text-sm text-slate-700 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                    ${explanation}
                </p>
                <button onclick="nextQuizQuestion()" class="w-full py-3 rounded-xl font-bold text-sm text-white shadow-md transition ${
                    isCorrect ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700'
                }">
                    ${isLastQuestion ? 'מסיימים ורואים ציון ←' : 'ממשיכים לשאלה הבאה ←'}
                </button>
            `;
            modal.classList.remove('hidden');
        }

        function nextQuizQuestion() {
            closeFeedbackModal();
            const totalQ = DAYS_DATA[state.selectedDayIndex].quiz.length;
            if (state.quizIndex < totalQ - 1) {
                state.quizIndex++;
                state.selectedOptionIndex = null;
                state.isAnswerChecked = false;
                render();
            } else {
                const dayNum = DAYS_DATA[state.selectedDayIndex].dayNumber;
                const finalPercent = Math.round((state.quizScore / totalQ) * 100);
                state.completedDays[dayNum] = {
                    completed: true,
                    score: finalPercent
                };
                localStorage.setItem('arabicPrepProgress_v2', JSON.stringify(state.completedDays));
                playSuccessSound('complete');
                switchTab('summary');
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            if (state.currentView === 'home') {
                container.innerHTML = renderHomeView();
            } else {
                container.innerHTML = renderDayView();
            }
        }

        // מסך הבית קומפקטי מותאם למסך יחיד בנייד
        function renderHomeView() {
            const completedCount = Object.keys(state.completedDays).length;
            const progressPercent = Math.round((completedCount / DAYS_DATA.length) * 100);

            let cardsHtml = DAYS_DATA.map((day, idx) => {
                const status = state.completedDays[day.dayNumber];
                const isDone = status && status.completed;

                return `
                    <div onclick="startDay(${idx})" class="bg-white rounded-xl shadow-xs hover:shadow-md border border-slate-200/90 px-3.5 py-2.5 transition-all cursor-pointer group flex items-center justify-between relative overflow-hidden">

                        <div class="pr-2 min-w-0">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold text-white bg-gradient-to-l ${day.badgeColor}">
                                    יום ${day.dayNumber}
                                </span>
                                <span class="text-[11px] text-slate-400">⏱️ ${day.duration}</span>

                            <h3 class="text-sm font-bold text-slate-800 group-hover:text-indigo-700 truncate">

                                <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-lg block">
                                    ${status.score}% ✓
                                </span>
                            ` : `
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1.5 rounded-lg block">
                                    מתחילים ←
                                </span>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="h-full flex flex-col justify-between gap-2">
                    <!-- מד התקדמות קומפקטי -->

                            </div>
                            <div class="bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-lg text-center">
                                <div class="text-xs font-extrabold text-indigo-800">${completedCount}/5 ימים</div>
                            </div>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">

                        </div>
                    </div>

                    <!-- רשימת 5 הימים מותאמת לגובה ללא גלילה -->

        function renderDayView() {
            const dayData = DAYS_DATA[state.selectedDayIndex];
            const tabs = [
                { id: 'flashcards', label: '1. כרטיסיות', icon: '🗂️' },
                { id: 'matching', label: '2. קוביות', icon: '🧩' },
                { id: 'quiz', label: '3. שאלות', icon: '❓' }
            ];

            let tabsHtml = tabs.map(t => {
                const isActive = state.activeTab === t.id;
                return `
                    <button onclick="switchTab('${t.id}')" class="flex-1 py-2 px-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 ${
                        isActive 
                        ? 'bg-indigo-600 text-white shadow-xs' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'
                    }">
                        <span>${t.icon}</span>
                        <span>${t.label}</span>
                    </button>
                `;
            }).join('');

            let stageContent = '';
            if (state.activeTab === 'flashcards') {
                stageContent = renderFlashcardsStage(dayData);
            } else if (state.activeTab === 'matching') {
                stageContent = renderMatchingStage(dayData);
            } else if (state.activeTab === 'quiz') {
                stageContent = renderQuizStage(dayData);
            } else if (state.activeTab === 'summary') {
                stageContent = renderSummaryStage(dayData);
            }

            return `
                <div class="h-full flex flex-col justify-between gap-2">
                    <!-- כותרת וסרגל שלבים קומפקטי -->
                    <div class="bg-white rounded-xl p-2.5 shadow-xs border border-slate-200/80 shrink-0">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="text-sm sm:text-base font-extrabold text-slate-800 truncate">${dayData.title}</h2>
                        </div>
                        ${state.activeTab !== 'summary' ? `
                            <div class="flex gap-1.5">
                                ${tabsHtml}
                            </div>
                        ` : ''}
                    </div>

                    <!-- אזור התרגול הפעיל שתופס את שאר גובה המסך -->
                    <div class="flex-1 min-h-0 flex flex-col justify-between">
                        ${stageContent}
                    </div>
                </div>
            `;
        }

        // שלב 1: כרטיסיות זיכרון גדולות מתהפכות (מותאם לגובה ללא גלילה)
        function renderFlashcardsStage(dayData) {
            const card = dayData.flashcards[state.cardIndex];
            const total = dayData.flashcards.length;

            return `
                <div class="h-full max-w-xl w-full mx-auto flex flex-col justify-between gap-2 py-1">
                    <div class="flex items-center justify-between text-xs font-semibold text-slate-600 px-1 shrink-0">
                        <span>כרטיסייה ${state.cardIndex + 1} מתוך ${total}</span>
                        <span class="text-indigo-600">לוחצים על הכרטיסייה להיפוך ↻</span>
                    </div>

                    <!-- כרטיסייה מתהפכת גמישה בגובה -->
                    <div onclick="toggleCardFlip()" class="perspective-1000 flex-1 min-h-0 w-full cursor-pointer">
                        <div class="relative w-full h-full transform-style-3d ${state.isCardFlipped ? 'rotate-y-180' : ''}">
                            
                            <!-- צד קדמי: ערבית בגדול -->
                            <div class="absolute inset-0 backface-hidden bg-white rounded-2xl shadow-sm border-2 border-indigo-100 flex flex-col items-center justify-center p-4 text-center hover:border-indigo-300 transition">
                                <span class="text-[11px] font-bold text-slate-400 bg-slate-100 px-2.5 py-0.5 rounded-full mb-2">ערבית</span>
                                <div class="arabic-text text-6xl sm:text-7xl font-extrabold text-slate-800 my-1 select-none">
                                    ${card.front}
                                </div>
                                <p class="text-xs text-slate-400 mt-3">מנסים להיזכר ולוחצים לבדיקה</p>
                            </div>

                            <!-- צד אחורי: שם האות / תרגום לעברית -->
                            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-600 to-blue-700 text-white rounded-2xl shadow-md flex flex-col items-center justify-center p-4 text-center">
                                <span class="text-[11px] font-bold text-indigo-200 bg-white/15 px-2.5 py-0.5 rounded-full mb-2">תשובה בעברית</span>
                                <div class="text-2xl sm:text-3xl font-extrabold mb-2">
                                    ${card.back}
                                </div>
                                ${card.hint ? `
                                    <div class="bg-white/15 backdrop-blur-xs rounded-xl px-3 py-2 text-xs text-blue-50 max-w-sm mt-1">
                                        💡 ${card.hint}
                                    </div>
                                ` : ''}
                            </div>

                        </div>
                    </div>

                    <!-- כפתורי ניווט תחתונים -->
                    <div class="flex items-center justify-between gap-2 shrink-0 pt-1">
                        <button onclick="prevCard()" ${state.cardIndex === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl font-bold text-xs border border-slate-300 bg-white text-slate-700 disabled:opacity-40 hover:bg-slate-50 transition">
                            → הקודם
                        </button>
                        
                        <button onclick="toggleCardFlip()" class="px-4 py-2.5 rounded-xl font-bold text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">
                            הופכים ↻
                        </button>

                        <button onclick="nextCard()" class="px-4 py-2.5 rounded-xl font-bold text-xs bg-indigo-600 text-white hover:bg-indigo-700 shadow-xs transition">
                            ${state.cardIndex === total - 1 ? 'לקוביות ←' : 'הבא ←'}
                        </button>
                    </div>
                </div>
            `;
        }

        // שלב 2: חיבור קוביות בין טורים (מותאם לגובה מסך יחיד ללא גלילה)
        function renderMatchingStage(dayData) {
            const allMatched = state.matchedIds.length === dayData.matchingPairs.length;

            let rightColHtml = state.matchingRightItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedRightId === item.id;
                const isError = isSelected && state.wrongPair;

                let btnStyle = "bg-white border-slate-200 text-slate-800 hover:border-indigo-400";
                if (isMatched) {
                    btnStyle = "bg-emerald-50 border-emerald-400 text-emerald-700 opacity-55 cursor-default animate-pop";
                } else if (isError) {
                    btnStyle = "bg-rose-50 border-rose-500 text-rose-700 animate-shake";
                } else if (isSelected) {
                    btnStyle = "bg-indigo-50 border-indigo-600 text-indigo-800 ring-2 ring-indigo-300";
                }

                return `
                    <button onclick="selectMatchingItem('right', '${item.id}')" ${isMatched ? 'disabled' : ''} class="flex-1 w-full px-2 rounded-xl border-2 font-bold transition-all shadow-2xs flex items-center justify-center ${btnStyle}">
                        <span class="arabic-text text-2xl sm:text-3xl leading-none">${item.text}</span>
                    </button>
                `;
            }).join('');

            let leftColHtml = state.matchingLeftItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedLeftId === item.id;
                const isError = isSelected && state.wrongPair;

                let btnStyle = "bg-white border-slate-200 text-slate-800 hover:border-indigo-400";
                if (isMatched) {
                    btnStyle = "bg-emerald-50 border-emerald-400 text-emerald-700 opacity-55 cursor-default animate-pop";
                } else if (isError) {
                    btnStyle = "bg-rose-50 border-rose-500 text-rose-700 animate-shake";
                } else if (isSelected) {
                    btnStyle = "bg-indigo-50 border-indigo-600 text-indigo-800 ring-2 ring-indigo-300";
                }

                return `
                    <button onclick="selectMatchingItem('left', '${item.id}')" ${isMatched ? 'disabled' : ''} class="flex-1 w-full px-2 rounded-xl border-2 font-bold text-xs sm:text-sm transition-all shadow-2xs flex items-center justify-center text-center leading-tight ${btnStyle}">
                        <span>${item.text}</span>
                    </button>
                `;
            }).join('');

            return `
                <div class="h-full max-w-2xl w-full mx-auto flex flex-col justify-between gap-1.5">
                    <div class="bg-blue-50 border border-blue-100 rounded-xl px-3 py-1.5 flex items-center justify-between shrink-0">
                        <p class="text-xs font-medium text-blue-900">
                            מחברים בין <strong>ערבית (ימין)</strong> ל<strong>עברית (שמאל)</strong>
                        </p>
                        <span class="text-[11px] font-bold bg-white text-blue-700 px-2 py-0.5 rounded-lg shadow-2xs shrink-0">
                            ${state.matchedIds.length} / ${dayData.matchingPairs.length}
                        </span>
                    </div>

                    ${allMatched ? `
                        <div class="flex-1 bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-5 flex flex-col items-center justify-center text-center space-y-3 animate-pop">
                            <div class="text-4xl">🎉</div>
                            <h3 class="text-xl font-extrabold text-emerald-800">כל הכבוד! חיברתם את כל הזוגות!</h3>
                            <p class="text-emerald-700 text-xs sm:text-sm">ממשיכים לשלב השלישי: שאלות אמריקאיות.</p>
                            <div class="pt-1 flex justify-center gap-2">
                                <button onclick="initMatchingGame(DAYS_DATA[${state.selectedDayIndex}].matchingPairs); render();" class="px-4 py-2.5 rounded-xl font-bold text-xs bg-white text-emerald-700 border border-emerald-300 hover:bg-emerald-100 transition">
                                    שוב ↻
                                </button>
                                <button onclick="switchTab('quiz')" class="px-5 py-2.5 rounded-xl font-bold text-xs bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm transition">
                                    לשאלות אמריקאיות ←
                                </button>
                            </div>
                        </div>
                    ` : `
                        <div class="flex-1 min-h-0 grid grid-cols-2 gap-2.5 sm:gap-4 pb-1">
                            <div class="flex flex-col gap-1.5 min-h-0">
                                ${rightColHtml}
                            </div>
                            <div class="flex flex-col gap-1.5 min-h-0">
                                ${leftColHtml}
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        // שלב 3: שאלות אמריקאיות (קומפקטי, המשוב קופץ ב-Modal כדי שלא תהיה גלילה)
        function renderQuizStage(dayData) {
            const q = dayData.quiz[state.quizIndex];
            const totalQ = dayData.quiz.length;

            let optionsHtml = q.options.map((opt, idx) => {
                let btnClasses = "bg-white border-slate-200 text-slate-800 hover:border-indigo-400 hover:bg-indigo-50/40";
                let badge = `<span class="w-6 h-6 rounded-md bg-slate-100 text-slate-600 font-bold text-xs flex items-center justify-center shrink-0">${idx + 1}</span>`;

                if (state.isAnswerChecked) {
                    if (idx === q.correctIndex) {
                        btnClasses = "bg-emerald-50 border-emerald-500 text-emerald-900";
                        badge = `<span class="w-6 h-6 rounded-md bg-emerald-500 text-white font-bold text-xs flex items-center justify-center shrink-0">✓</span>`;
                    } else if (idx === state.selectedOptionIndex) {
                        btnClasses = "bg-rose-50 border-rose-500 text-rose-900";
                        badge = `<span class="w-6 h-6 rounded-md bg-rose-500 text-white font-bold text-xs flex items-center justify-center shrink-0">✕</span>`;
                    } else {
                        btnClasses = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                    }
                }

                const hasArabic = /[\u0600-\u06FF]/.test(opt);

                return `
                    <button onclick="selectQuizOption(${idx})" ${state.isAnswerChecked ? 'disabled' : ''} class="flex-1 w-full px-3 py-2 rounded-xl border-2 text-right font-bold transition-all flex items-center gap-2.5 shadow-2xs ${btnClasses}">
                        ${badge}
                        <span class="${hasArabic ? 'arabic-text text-xl sm:text-2xl leading-none' : 'text-xs sm:text-sm leading-tight'}">${opt}</span>
                    </button>
                `;
            }).join('');

            return `
                <div class="h-full max-w-2xl w-full mx-auto flex flex-col justify-between gap-2 pb-1">
                    <div class="flex items-center justify-between text-xs font-semibold text-slate-600 px-1 shrink-0">
                        <span>שאלה ${state.quizIndex + 1} מתוך ${totalQ}</span>
                        <span class="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full">ניקוד: ${state.quizScore}</span>
                    </div>

                    <div class="flex-1 min-h-0 bg-white rounded-2xl p-3.5 sm:p-5 shadow-xs border border-slate-200/80 flex flex-col justify-between text-center">
                        <div class="shrink-0 space-y-2">
                            <h3 class="text-sm sm:text-base font-bold text-slate-800 leading-snug">
                                ${q.question}
                            </h3>
                            
                            ${q.arabicDisplay && q.arabicDisplay !== '؟' ? `
                                <div class="inline-block bg-slate-50 border border-slate-200/80 rounded-xl px-5 py-1.5">
                                    <span class="arabic-text text-3xl sm:text-4xl font-extrabold text-indigo-900">
                                        ${q.arabicDisplay}
                                    </span>
                                </div>
                            ` : ''}
                        </div>

                        <!-- אפשרויות בחירה מרווחות לגובה המסך -->
                        <div class="flex-1 min-h-0 flex flex-col justify-center gap-2 pt-2 text-right">
                            ${optionsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // מסך סיכום יום תרגול
        function renderSummaryStage(dayData) {
            const totalQ = dayData.quiz.length;
            const percent = Math.round((state.quizScore / totalQ) * 100);
            const hasNextDay = state.selectedDayIndex < DAYS_DATA.length - 1;

            let feedbackTitle = "עבודה נהדרת!";
            let feedbackMsg = "סיימתם בהצלחה את כל שלושת חלקי התרגול של היום.";
            if (percent === 100) {
                feedbackTitle = "ציון מושלם! אלופים! 🏆";
                feedbackMsg = "שליטה מלאה באותיות, בתנועות ובאוצר המילים של היום.";
            } else if (percent >= 70) {
                feedbackTitle = "כל הכבוד! התקדמות מעולה 🌟";
                feedbackMsg = "אתם בדרך הנכונה להצלחה במבחן.";
            } else {
                feedbackTitle = "התחלה טובה! 💪";
                feedbackMsg = "מומלץ לעבור שוב על הכרטיסיות ולנסות את החידון פעם נוספת.";
            }

            return `
                <div class="h-full max-w-xl w-full mx-auto bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center space-y-4 animate-pop">
                    <div class="w-14 h-14 mx-auto rounded-full bg-indigo-50 flex items-center justify-center text-3xl">
                        🎯
                    </div>
                    <div>
                        <span class="text-xs font-bold text-indigo-600 uppercase">סיכום יום ${dayData.dayNumber}</span>
                        <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 mt-1">${feedbackTitle}</h3>
                        <p class="text-slate-600 text-xs sm:text-sm mt-1">${feedbackMsg}</p>
                    </div>

                    <div class="w-full bg-slate-50 rounded-xl p-3.5 border border-slate-200/80 flex justify-around">
                        <div>
                            <div class="text-[11px] text-slate-500 font-semibold">תשובות נכונות</div>
                            <div class="text-xl font-extrabold text-slate-800">${state.quizScore} / ${totalQ}</div>
                        </div>
                        <div class="w-px bg-slate-200"></div>
                        <div>
                            <div class="text-[11px] text-slate-500 font-semibold">ציון בחידון</div>
                            <div class="text-xl font-extrabold text-indigo-600">${percent}%</div>
                        </div>
                    </div>

                    <div class="w-full flex flex-col sm:flex-row gap-2 justify-center pt-1">
                        <button onclick="switchTab('flashcards')" class="px-4 py-3 rounded-xl font-bold text-xs bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
                            מתרגלים יום זה שוב ↻
                        </button>
                        ${hasNextDay ? `
                            <button onclick="startDay(${state.selectedDayIndex + 1})" class="px-5 py-3 rounded-xl font-bold text-xs bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm transition">
                                עוברים ליום ${dayData.dayNumber + 1} ←
                            </button>
                        ` : `
                            <button onclick="goHome()" class="px-5 py-3 rounded-xl font-bold text-xs bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm transition">
                                חזרה למסך הראשי ✓
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        // הפעלה ראשונית בטעינת העמוד
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
```
